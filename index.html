<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        :root {
            --bg: #FFFFFF;
            --text: #000000;
            --accent: #E60000;
            --font-main: 'Courier New', Courier, monospace; 
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            margin: 0;
            padding: 5%;
        }
        header {
            border-bottom: 2px solid var(--text);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        h1, h2 {
            text-transform: uppercase;
            letter-spacing: -1px;
        }
        .accent {
            color: var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            border: 1px solid var(--text);
            padding: 20px;
            transition: border-color 0.2s ease;
        }
        .card:hover {
            border-color: var(--accent);
        }
        img {
            max-width: 100%;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }
        img:hover {
            filter: grayscale(0%);
        }
    </style>
</head>
<body>
    <header>
        <h1>Portfolio <span class="accent">[2026]</span></h1>
        <p>Selected_Works</p>
    </header>
    <section class="grid">
        <div class="card">
            <h2>Project_01</h2>
            <img src="project-01-main-view.jpg" alt="Project 1">
            <p>System Architecture.</p>
        </div>
        <div class="card">
            <h2>Project_02</h2>
            <img src="project-02-product-mockup.jpg" alt="Project 2">
            <p>Hardware Integration.</p>
        </div>
    </section>
</body>
</html>
